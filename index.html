<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 교무수첩</title>
<meta name="description" content="교사 개인용 학급·수업 관리 웹앱 (명렬표, 출결, 진도표, 고입 내신 계산). 개인정보 입력을 요구하지 않습니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#222; --muted:#888; --line:#e6e2d9;
  --accent:#e8772e; --accent-soft:#fdebdc; --blue:#3b6fd8; --blue-soft:#e3ecfb;
  --green:#2f9e62; --green-soft:#dff3e7; --red:#d64545; --red-soft:#fbe2e2;
  --yellow:#b8860b; --yellow-soft:#fbf1d3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
nav{max-width:1100px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto}
h2{margin:0 0 14px;font-size:20px}
.muted{color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center}
ul.plain li:last-child{border-bottom:0}
.time{color:var(--muted);font-size:13px;min-width:44px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=date],input[type=month],input[type=time],input[type=tel],input[type=password],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#faf8f4}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.x{border:0;background:none;color:var(--muted);padding:2px 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:140px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:#eee;white-space:nowrap}
.b-학사,.b-NEIS{background:var(--blue-soft);color:var(--blue)}
.b-업무{background:var(--accent-soft);color:var(--accent)}
.b-개인{background:var(--green-soft);color:var(--green)}
.b-할일{background:var(--yellow-soft);color:var(--yellow)}
.b-상담{background:var(--blue-soft);color:var(--blue)}
.b-칭찬{background:var(--green-soft);color:var(--green)}
.b-생활지도{background:var(--red-soft);color:var(--red)}
.b-누가기록{background:#eee;color:#555}
.b-세특,.b-진로,.b-행동특성,.b-자율·동아리{background:var(--yellow-soft);color:var(--yellow)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500}
.tbl-wrap{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 9px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.t-결석{background:var(--red)}
.seg button.on.t-지각,.seg button.on.t-조퇴,.seg button.on.t-결과{background:var(--accent)}
.sub{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
.sub button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .h{background:#faf8f4;text-align:center;font-size:13px;padding:6px 0;color:var(--muted)}
.cal .d{background:#fff;min-height:92px;padding:4px 5px;cursor:pointer;overflow:hidden}
.cal .d.out{background:#fbfaf7;color:#bbb}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d .n{font-size:13px;font-weight:500}
.cal .d.today .n{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px}
.cal .d .ev{font-size:11.5px;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sun{color:var(--red)} .sat{color:var(--blue)}
/* timetable */
.tt input{width:100%;border:0;padding:8px 4px;text-align:center;background:transparent}
.tt input:focus{background:var(--accent-soft);outline:none}
.tt td{padding:0;border:1px solid var(--line)}
.tt th{text-align:center;border:1px solid var(--line);padding:6px}
.tt td.p{padding:4px 6px;white-space:nowrap;background:#faf8f4;width:110px}
.tt td.p input{width:84px;border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.tt tr.now td{background:var(--accent-soft)}
/* lesson progress */
.wk td.lc{vertical-align:top;cursor:pointer;min-width:120px;height:58px;border:1px solid var(--line);padding:5px 6px}
.wk th{border:1px solid var(--line);text-align:center;padding:6px 4px}
.wk td.p{border:1px solid var(--line);background:#faf8f4;white-space:nowrap}
.wk td.lc:hover{background:#faf8f4}
.wk td.today{background:#fffaf5}
.wk td.chg{background:var(--accent-soft)}
.wk td.off{background:#f3f3f3;color:var(--muted)}
.wk td.pick{outline:3px solid var(--accent);outline-offset:-3px}
.wk td.swapping:hover{outline:2px dashed var(--accent);outline-offset:-2px}
.wk .ls{font-weight:500;font-size:14px}
.wk .lp{font-size:12.5px;color:var(--blue);margin-top:2px}
.wk .lm{font-size:12px;color:var(--muted);margin-top:1px;white-space:pre-wrap}
.tt-ev{font-size:11px;font-weight:400;color:var(--blue);white-space:normal}
tr.sel-row td{background:var(--accent-soft)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:560px}
.modal h3{margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.notice{background:var(--yellow-soft);border:1px solid #f0dfa8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.rec{padding:8px 0;border-bottom:1px solid var(--line)}
.rec .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec .txt{white-space:pre-wrap;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.done{text-decoration:line-through;color:var(--muted)}
.overdue{color:var(--red);font-weight:500}
.meal li{border:0!important;padding:1px 0!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){
  .cal .d{min-height:62px}
  .cal .d .ev{font-size:10px}
  main{padding:12px}
}
@media print{
  header,.noprint,.btn{display:none!important}
  body{background:#fff}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">📒 나의 교무수첩<small id="subtitle"></small></div>
    <div class="muted" id="sync" style="font-size:13px;cursor:pointer" onclick="App.tab('settings')"></div>
    <div class="muted" id="clock"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 저장소 ============ */
const KEY = 'gyomu-v1';
const DEF = {
  settings:{teacher:'',className:'',schoolName:'',atpt:'',school:'',neisKey:'',lastBackup:'',firebase:'',
    times:['08:50','09:45','10:40','11:35','13:25','14:20','15:15']},
  students:[], attendance:{}, records:[], events:[], todos:[], timetable:{}, lessons:{}, memos:{},
  meta:{updatedAt:0, syncedOnce:false},
  jinhak:{ config:{estimateMissing:true},
    data:{}
  }
};
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(!d) return JSON.parse(JSON.stringify(DEF));
    const base = JSON.parse(JSON.stringify(DEF));
    const j = d.jinhak || {};
    return Object.assign(base, d, {
      settings:Object.assign(base.settings, d.settings||{}),
      meta:Object.assign(base.meta, d.meta||{}),
      jinhak:{config:Object.assign(base.jinhak.config, j.config||{}), data:j.data||{}}
    });
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
let S = load();
function save(){
  S.meta.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(S));
  syncSchedule();
}

/* ============ 도우미 ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DOW = '일월화수목금토';
const fmtD = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stu = id => S.students.find(s => s.id === id);
const stuName = id => { const s = stu(id); return s ? `${s.no}. ${s.name}` : '(삭제된 학생)'; };
const sortedStudents = () => [...S.students].sort((a,b) => (+a.no||999) - (+b.no||999) || a.name.localeCompare(b.name));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1600); }
function stuOptions(sel, withAll){
  return (withAll ? `<option value="">전체 학생</option>` : `<option value="">학생 선택</option>`) +
    sortedStudents().map(s => `<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.no)}. ${esc(s.name)}</option>`).join('');
}

const REC_CATS = ['누가기록','상담','칭찬','생활지도','행동특성','진로','자율·동아리','세특'];
const EV_CATS = ['업무','학사','개인'];
const ATT_TYPES = ['출석','결석','지각','조퇴','결과'];
const ATT_REASONS = ['질병','미인정','기타','출석인정'];

/* ============ NEIS (급식·학사일정, 선택) ============ */
const neisCache = {};
async function neis(svc, params, needSchool=true){
  const s = S.settings;
  if(needSchool && (!s.atpt || !s.school)) return null;
  const q = new URLSearchParams({Type:'json', pIndex:1, pSize:200, ...params});
  if(needSchool){ q.set('ATPT_OFCDC_SC_CODE', s.atpt); q.set('SD_SCHUL_CODE', s.school); }
  if(s.neisKey) q.set('KEY', s.neisKey);
  const url = `https://open.neis.go.kr/hub/${svc}?${q}`;
  if(neisCache[url]) return neisCache[url];
  const r = await fetch(url);
  const j = await r.json();
  const rows = (j[svc] && j[svc][1] && j[svc][1].row) || [];
  neisCache[url] = rows;
  return rows;
}
const schedCache = {}; // 'YYYY-MM' -> [{date,title}] | 'loading'
async function loadSched(ym){
  if(schedCache[ym]) return;
  schedCache[ym] = 'loading';
  try{
    const [y,m] = ym.split('-');
    const last = new Date(+y, +m, 0).getDate();
    const rows = await neis('SchoolSchedule', {AA_FROM_YMD:`${y}${m}01`, AA_TO_YMD:`${y}${m}${last}`});
    schedCache[ym] = (rows||[]).filter(r => r.EVENT_NM && r.EVENT_NM !== '토요휴업일')
      .map(r => ({date:`${r.AA_YMD.slice(0,4)}-${r.AA_YMD.slice(4,6)}-${r.AA_YMD.slice(6,8)}`, title:r.EVENT_NM}));
  }catch(e){ schedCache[ym] = []; }
  if(ui.tab === 'calendar' || ui.tab === 'today') render();
}
const schedFor = ym => Array.isArray(schedCache[ym]) ? schedCache[ym] : [];

/* ============ 화면 상태 ============ */
const ui = {
  tab:'today', classSub:'roster', attDate:today(), statPeriod:today().slice(0,7),
  calMonth:today().slice(0,7), calSel:today(), recSid:'', recCat:'', showDone:false
};
const TABS = [['today','오늘'],['calendar','달력'],['class','학급'],['records','기록·상담'],['jinhak','진학'],['timetable','시간표·진도'],['todos','할 일'],['settings','설정']];

function render(){
  $('#nav').innerHTML = TABS.map(([k,n]) => `<button class="${ui.tab===k?'on':''}" onclick="App.tab('${k}')">${n}</button>`).join('');
  const st = S.settings;
  $('#subtitle').textContent = [st.schoolName, st.className, st.teacher && st.teacher+' 선생님'].filter(Boolean).join(' · ');
  $('#main').innerHTML = V[ui.tab]();
  if(ui.tab === 'today') afterToday();
  if(ui.tab === 'calendar') loadSched(ui.calMonth);
}

/* ============ 화면들 ============ */
const V = {};

V.today = () => {
  const t = today(), d = new Date(), dow = d.getDay();
  const st = S.settings;
  let warn = '';
  if(!S.students.length) warn += `<div class="notice">👋 처음 오셨나요? <b>학급 → 명렬표</b>에서 학생 명단을 붙여넣고, <b>설정</b>에서 학교를 선택하면 급식·학사일정이 자동으로 떠요.</div>`;
  const daysSince = st.lastBackup ? Math.floor((parseD(t) - parseD(st.lastBackup))/864e5) : null;
  if(S.students.length && (daysSince === null || daysSince >= 7))
    warn += `<div class="notice noprint">💾 기록은 이 브라우저에만 저장돼요. ${daysSince===null?'아직 백업한 적이 없어요':daysSince+'일째 백업하지 않았어요'}. <button class="btn sm" onclick="App.backup()">지금 백업 파일 받기</button></div>`;

  const tt = (dow >= 1 && dow <= 5)
    ? `<ul class="plain">${st.times.map((tm,i) => { const L = lessonAt(t, i+1); return `<li style="cursor:pointer" onclick="App.lessonEdit('${t}',${i+1})"><b>${i+1}교시</b><span class="time">${tm}</span><span class="grow ${L.sub&&!L.off?'':'muted'}">${L.off?`<s>${esc(L.sub)||'수업'}</s> 없음`:esc(L.sub)||'—'}${L.changed?' <span class="badge b-업무">교체</span>':''}${L.prog?`<br><span class="muted" style="font-size:13px">📖 ${esc(L.prog)}</span>`:''}</span></li>`; }).join('')}</ul>`
    : `<p class="muted">오늘은 수업이 없어요.</p>`;

  const end = ymd(addDays(d,7));
  const mine = S.events.filter(e => e.date >= t && e.date <= end).map(e => ({...e}));
  const neisEv = [...schedFor(t.slice(0,7)), ...schedFor(end.slice(0,7))].filter((e,i,a)=>a.findIndex(x=>x.date===e.date&&x.title===e.title)===i)
    .filter(e => e.date >= t && e.date <= end).map(e => ({...e, cat:'NEIS'}));
  const evs = [...mine, ...neisEv].sort((a,b) => a.date.localeCompare(b.date));
  const evHtml = evs.length ? `<ul class="plain">${evs.map(e => `<li><span class="time">${e.date===t?'<b>오늘</b>':fmtD(e.date)}</span><span class="badge b-${e.cat}">${e.cat==='NEIS'?'학사':e.cat}</span>${esc(e.title)}</li>`).join('')}</ul>` : `<p class="muted">앞으로 7일 동안 일정이 없어요.</p>`;

  const todos = S.todos.filter(x => !x.done).sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999')).slice(0,8);
  const todoHtml = todos.length ? `<ul class="plain">${todos.map(x => `<li><input type="checkbox" onchange="App.toggleTodo('${x.id}')"><span class="grow">${esc(x.title)}</span>${x.due?`<span class="time ${x.due<t?'overdue':''}">${x.due===t?'오늘':fmtD(x.due)}</span>`:''}</li>`).join('')}</ul>` : `<p class="muted">남은 할 일이 없어요 🎉</p>`;

  const att = S.attendance[t] || {};
  const attList = Object.entries(att);
  const attHtml = attList.length ? `<ul class="plain">${attList.map(([sid,r]) => `<li>${esc(stuName(sid))} <span class="badge">${r.reason}${r.type}</span><span class="muted">${esc(r.note||'')}</span></li>`).join('')}</ul>` : `<p class="muted">모두 출석 (기록 없음)</p>`;

  return `${warn}
  <h2>${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[dow]}요일</h2>
  <div class="grid">
    <div class="card"><h3>✍️ 한 줄 기록 <span class="sp muted" style="font-size:12px">Ctrl+Enter 저장</span></h3>
      <div class="row" style="margin-bottom:8px">
        <select id="qr-sid" class="grow">${stuOptions('')}</select>
        <select id="qr-cat">${REC_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <textarea id="qr-text" rows="3" placeholder="예) 토론 수업에서 상대 의견을 근거를 들어 반박함" onkeydown="if(event.ctrlKey&&event.key==='Enter')App.quickRec()"></textarea>
      <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn pri" onclick="App.quickRec()">저장</button></div>
    </div>
    <div class="card"><h3>📚 오늘 수업 <button class="btn sm sp" onclick="App.tab('timetable')">진도표</button></h3>${tt}</div>
    <div class="card"><h3>🗓 다가오는 일정 <button class="btn sm sp" onclick="App.tab('calendar')">달력</button></h3>${evHtml}</div>
    <div class="card"><h3>✅ 할 일 <button class="btn sm sp" onclick="App.tab('todos')">전체</button></h3>
      <div class="row" style="margin-bottom:6px"><input type="text" id="qt-title" class="grow" placeholder="할 일 추가 (Enter)" onkeydown="if(event.key==='Enter')App.quickTodo()"><input type="date" id="qt-due"></div>
      ${todoHtml}</div>
    <div class="card"><h3>🙋 오늘 출결 <button class="btn sm sp" onclick="App.goAtt()">출결 입력</button></h3>${attHtml}</div>
    <div class="card"><h3>🍱 오늘 급식</h3><div id="meal" class="muted">${st.school?'불러오는 중…':'설정에서 학교를 선택하면 표시돼요.'}</div></div>

async function afterToday(){
  const t = today();
  loadSched(t.slice(0,7));
  const end = ymd(addDays(new Date(),7));
  if(end.slice(0,7) !== t.slice(0,7)) loadSched(end.slice(0,7));
  const box = $('#meal');
  if(!box || !S.settings.school) return;
  try{
    const rows = await neis('mealServiceDietInfo', {MLSV_YMD:t.replace(/-/g,'')});
    if(!$('#meal')) return;
    if(!rows || !rows.length){ $('#meal').textContent = '오늘은 급식 정보가 없어요.'; return; }
    $('#meal').innerHTML = rows.map(r => `<div style="margin-bottom:6px"><b style="color:var(--ink)">${esc(r.MMEAL_SC_NM)}</b><ul class="plain meal" style="color:var(--ink)">${
      r.DDISH_NM.split(/<br\s*\/?>/i).map(x => `<li>${esc(x.replace(/\s*\([\d.\s]+\)\s*/g,'').trim())}</li>`).join('')}</ul></div>`).join('');
  }catch(e){ if($('#meal')) $('#meal').textContent = '급식 정보를 불러오지 못했어요.'; }
}

V.calendar = () => {
  const [y,m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const start = addDays(first, -first.getDay());
  const t = today();
  const neisEv = schedFor(ui.calMonth);
  let cells = DOW.split('').map((w,i) => `<div class="h ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');
  for(let i=0;i<42;i++){
    const d = addDays(start,i), ds = ymd(d);
    if(i===35 && d.getMonth() !== m-1) break;
    const items = [
      ...neisEv.filter(e=>e.date===ds).map(e=>`<div class="ev b-학사">${esc(e.title)}</div>`),
      ...S.events.filter(e=>e.date===ds).map(e=>`<div class="ev b-${e.cat}">${esc(e.title)}</div>`),
      ...S.todos.filter(x=>x.due===ds && !x.done).map(x=>`<div class="ev b-할일">☐ ${esc(x.title)}</div>`)
    ].join('');
    const cls = ['d', d.getMonth()!==m-1?'out':'', ds===t?'today':'', ds===ui.calSel?'sel':''].join(' ');
    const dc = d.getDay()===0?'sun':d.getDay()===6?'sat':'';
    cells += `<div class="${cls}" onclick="App.calSel('${ds}')"><span class="n ${dc}">${d.getDate()}</span>${items}</div>`;
  }
  const sel = ui.calSel;
  const selItems = [
    ...neisEv.filter(e=>e.date===sel).map(e=>`<li><span class="badge b-학사">학사</span>${esc(e.title)}<span class="muted" style="margin-left:auto;font-size:12px">NEIS</span></li>`),
    ...S.events.filter(e=>e.date===sel).map(e=>`<li><span class="badge b-${e.cat}">${e.cat}</span><span class="grow">${esc(e.title)}</span><button class="btn x" onclick="App.delEvent('${e.id}')">✕</button></li>`),
    ...S.todos.filter(x=>x.due===sel).map(x=>`<li><span class="badge b-할일">할 일</span><span class="${x.done?'done':''}">${esc(x.title)}</span></li>`)
  ].join('');
  return `
  <div class="row" style="margin-bottom:12px">
    <button class="btn" onclick="App.calMove(-1)">◀</button>
    <h2 style="margin:0">${y}년 ${m}월</h2>
    <button class="btn" onclick="App.calMove(1)">▶</button>
    <button class="btn" onclick="App.calMove(0)">오늘</button>
  </div>
  <div class="cal">${cells}</div>
  <div class="card" style="margin-top:14px">
    <h3>${fmtD(sel)} 일정</h3>
    <ul class="plain">${selItems || '<li class="muted">일정이 없어요.</li>'}</ul>
    <div class="row" style="margin-top:10px">
      <select id="ev-cat">${EV_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
      <input type="text" id="ev-title" class="grow" placeholder="일정 추가 (Enter)" onkeydown="if(event.key==='Enter')App.addEvent()">
      <button class="btn pri" onclick="App.addEvent()">추가</button>
    </div>
  </div>`;
};

V.class_stat = () => {
  const p = ui.statPeriod;
  const days = Object.keys(S.attendance).filter(d => d.startsWith(p)).sort();

  const cell = (sid, type) => {
    const hits = days.filter(d => S.attendance[d][sid] && S.attendance[d][sid].type === type).map(d => ({d, r:S.attendance[d][sid]}));
    if(!hits.length) return '<td class="muted">·</td>';
    const by = {}; hits.forEach(h => by[h.r.reason] = (by[h.r.reason]||0)+1);
    const tip = hits.map(h => `${fmtD(h.d)} ${h.r.reason}${h.r.note?' - '+h.r.note:''}`).join('\n');
    return `<td title="${esc(tip)}"><b>${hits.length}</b> <span class="muted" style="font-size:12px">${Object.entries(by).map(([k,v])=>k+v).join('·')}</span></td>`;

const App = {
  tab(k){ ui.tab = k; render(); window.scrollTo(0,0); },
  goAtt(){ ui.tab='class'; ui.classSub='att'; ui.attDate=today(); render(); },
  classSub(k){ ui.classSub = k; render(); },

  // 오늘
  quickRec(){
    const sid = $('#qr-sid').value, text = $('#qr-text').value.trim();
    if(!sid) return toast('학생을 선택해 주세요');
    if(!text) return toast('내용을 입력해 주세요');
    S.records.push({id:uid(), sid, cat:$('#qr-cat').value, date:today(), text});
    save(); $('#qr-text').value = ''; toast(`${stu(sid).name} 기록 저장됨`);
  },
  quickTodo(){
    const title = $('#qt-title').value.trim(); if(!title) return;
    S.todos.push({id:uid(), title, due:$('#qt-due').value, done:false}); save(); render();
    setTimeout(()=>$('#qt-title')&&$('#qt-title').focus(),0);
  },
  memo(d, v){ if(v.trim()) S.memos[d] = v; else delete S.memos[d]; save(); },

  // 달력
  calMove(n){
    if(n===0){ ui.calMonth = today().slice(0,7); ui.calSel = today(); }
    else { const [y,m] = ui.calMonth.split('-').map(Number); const d = new Date(y, m-1+n, 1); ui.calMonth = ymd(d).slice(0,7); ui.calSel = ymd(d); }
    render();
  },
  calSel(d){ ui.calSel = d; if(d.slice(0,7)!==ui.calMonth) ui.calMonth = d.slice(0,7); render(); setTimeout(()=>$('#ev-title')&&$('#ev-title').focus(),0); },
  addEvent(){
    const title = $('#ev-title').value.trim(); if(!title) return;
    S.events.push({id:uid(), date:ui.calSel, title, cat:$('#ev-cat').value}); save(); render();

/* ============ 수업 진도표: 날짜별 시간표 · 수업 교체 · 차시 기록 ============
   S.timetable          : 기본(마스터) 시간표  '요일-교시' → '3-2 국어'
   S.lessons[날짜][교시] : 그날만의 변경  {sub?:바뀐 수업, off?:수업 없음, prog?:진도/차시, memo?:메모}      */
const TT_SUBS = [['week','주간 진도표'],['class','반별 진도'],['base','기본 시간표']];
ui.ttSub = 'week'; ui.ttWeek = ''; ui.swapMode = false; ui.swapA = null; ui.progCls = '';
const mondayOf = ds => { const d = parseD(ds), w = d.getDay(); return ymd(addDays(d, w === 0 ? 1 : 1 - w)); };
const isWeekday = ds => { const w = parseD(ds).getDay(); return w >= 1 && w <= 5; };
function lessonAt(ds, p){
  const o = (S.lessons[ds] || {})[p] || {};
  const base = S.timetable[parseD(ds).getDay() + '-' + p] || '';
  const sub = ('sub' in o) ? o.sub : base;
  return {sub, base, changed: ('sub' in o) && o.sub !== base, off: !!o.off, prog: o.prog || '', memo: o.memo || ''};
}
function setLesson(ds, p, v){
  const base = S.timetable[parseD(ds).getDay() + '-' + p] || '';
  const o = {};
  if(v.sub !== undefined && v.sub !== base) o.sub = v.sub;
  if(v.off) o.off = true;
  if(v.prog) o.prog = v.prog;
  if(v.memo) o.memo = v.memo;
  S.lessons[ds] = S.lessons[ds] || {};
  if(Object.keys(o).length) S.lessons[ds][p] = o; else delete S.lessons[ds][p];
  if(!Object.keys(S.lessons[ds]).length) delete S.lessons[ds];
}
function knownClasses(){
  const set = new Set(Object.values(S.timetable).filter(Boolean));
  Object.values(S.lessons).forEach(day => Object.values(day).forEach(o => { if(o.sub) set.add(o.sub); }));
  return [...set].sort((a,b) => a.localeCompare(b, 'ko', {numeric:true}));
}
// 이 수업 바로 전에 같은 반에서 기록한 진도
function lastProg(cls, ds, p){
  if(!cls) return null;
  const days = Object.keys(S.lessons).filter(d => d <= ds).sort().reverse();
  for(const d of days){
    const ps = Object.keys(S.lessons[d]).map(Number).sort((a,b)=>b-a);
    for(const q of ps){
      if(d === ds && q >= +p) continue;
      const L = lessonAt(d, q);
      if(!L.off && L.sub === cls && L.prog) return {date:d, p:q, prog:L.prog};
    }
  }
  return null;
}
// "2단원 3차시" → "2단원 4차시" (마지막 숫자 +1)
function nextProg(t){
  if(/\d+(?=\s*차시)/.test(t)) return t.replace(/(\d+)(?=\s*차시)(?![\s\S]*\d+\s*차시)/, n => +n + 1);
  return /\d+(?!.*\d)/.test(t) ? t.replace(/(\d+)(?!.*\d)/, n => +n + 1) : t;
}
function semStart(){
  if(S.settings.semStart) return S.settings.semStart;
  const t = today(), y = t.slice(0,4);
  return t.slice(5) >= '08-01' ? `${y}-08-01` : `${y}-03-01`;
}

V.timetable = () => {
  const head = `<div class="sub noprint">${TT_SUBS.map(([k,n]) => `<button class="${ui.ttSub===k?'on':''}" onclick="App.ttSub('${k}')">${n}</button>`).join('')}</div>`;
  return head + V['tt_' + ui.ttSub]();
};

V.tt_week = () => {
  const mon = ui.ttWeek || mondayOf(today());
  const days = [0,1,2,3,4].map(i => ymd(addDays(parseD(mon), i)));
  const t = today();
  [...new Set(days.map(d => d.slice(0,7)))].forEach(loadSched);
  const ev = d => schedFor(d.slice(0,7)).filter(e => e.date === d).map(e => e.title);
  const head = days.map(d => { const e = ev(d); return `<th style="${d===t?'color:var(--accent)':''}">${fmtD(d)}${e.length?`<div class="tt-ev">${esc(e.join(' · '))}</div>`:''}</th>`; }).join('');
  const rows = S.settings.times.map((tm, i) => {
    const p = i + 1;
    return `<tr><td class="p"><b>${p}</b> <span class="muted" style="font-size:12px">${tm}</span></td>${days.map(d => {
      const L = lessonAt(d, p), sel = ui.swapA && ui.swapA.d === d && ui.swapA.p === p;
      const cls = ['lc', d===t?'today':'', L.changed?'chg':'', L.off?'off':'', sel?'pick':'', ui.swapMode?'swapping':''].join(' ');
      const inner = L.off
        ? `<div class="ls"><s>${esc(L.sub)||'수업'}</s> <span class="badge">없음</span></div>${L.memo?`<div class="lm">${esc(L.memo)}</div>`:''}`
        : L.sub
          ? `<div class="ls">${esc(L.sub)}${L.changed?' <span class="badge b-업무">교체</span>':''}</div>${L.prog?`<div class="lp">${esc(L.prog)}</div>`:''}${L.memo?`<div class="lm">${esc(L.memo)}</div>`:''}`
          : `<div class="lm" style="text-align:center">${L.prog||L.memo?esc(L.prog||L.memo):'＋'}</div>`;
      return `<td class="${cls}" onclick="App.cell('${d}',${p})">${inner}</td>`;
    }).join('')}</tr>`;
  }).join('');
  const changes = days.reduce((n, d) => n + S.settings.times.filter((_, i) => lessonAt(d, i+1).changed || lessonAt(d, i+1).off).length, 0);
  const swapBar = ui.swapMode
    ? `<div class="notice noprint">🔁 <b>수업 교체 중</b> — ${ui.swapA ? `<b>${fmtD(ui.swapA.d)} ${ui.swapA.p}교시 (${esc(lessonAt(ui.swapA.d, ui.swapA.p).sub)||'빈 시간'})</b>와 바꿀 칸을 누르세요. 다른 주와 바꾸려면 ◀ ▶로 넘긴 뒤 누르면 돼요.` : '바꿀 <b>첫 번째 수업</b>을 누르세요.'} <button class="btn sm" onclick="App.swapToggle()">그만하기</button></div>`
    : '';
  return `${swapBar}<div class="card">
    <h3>🗓 주간 진도표
      <span class="sp row noprint">
        <button class="btn sm" onclick="App.ttWeek(-7)">◀</button>
        <input type="date" value="${mon}" onchange="App.ttWeekSet(this.value)">
        <button class="btn sm" onclick="App.ttWeek(7)">▶</button>
        <button class="btn sm" onclick="App.ttWeekSet(today())">이번 주</button>
        <button class="btn sm ${ui.swapMode?'pri':''}" onclick="App.swapToggle()">🔁 수업 교체</button>
        <button class="btn sm" onclick="window.print()">인쇄</button>
      </span></h3>
    <p class="muted noprint" style="margin:0 0 8px;font-size:13px">칸을 누르면 그날 수업의 <b>진도(차시)·메모</b>를 기록하거나 그날만 수업을 바꿀 수 있어요. 기본 시간표는 그대로 두고 그 날짜에만 적용돼요.${changes?` · 이번 주 변경 ${changes}건`:''}</p>

/* ============ 진학: 광주 고입 내신 산출 (300점) ============
   근거: 광주광역시 고등학교 입학전형 기본계획 내신성적 산출지침 (교육감 선발 후기 평준화고)
   교과 240 = 일반교과 180 (1-2 18, 2-1 36, 2-2 36, 3-1 45, 3-2 45) + 예체능 60
   비교과 60 = 출결 15 + 봉사 15 + 창의적체험활동 15 + 행동발달 15 (학년별 5점)            */
const JH_SEMS = [{k:'1-2',p:18},{k:'2-1',p:36},{k:'2-2',p:36},{k:'3-1',p:45},{k:'3-2',p:45}];
const JH_SUBS = [['list','성적 현황'],['paste','일괄 붙여넣기'],['config','산출 기준']];
const YRS = ['1','2','3'];
ui.jhSub = 'list'; ui.jhSort = 'no';
const jhD = sid => {
  const d = S.jinhak.data[sid] = S.jinhak.data[sid] || {};
  d.grades = d.grades || {}; d.art = d.art || '';
  ['att','vol','act','beh'].forEach(k => { if(typeof d[k] !== 'object' || d[k] === null) d[k] = {}; });
  return d;
};
const rnd = (x, n) => { const f = Math.pow(10, n); return Math.round(x * f + 1e-9) / f; };
const r3 = x => rnd(x, 3).toFixed(3);
const CONV = {A:5, B:4, C:3, D:2, E:1};
// 평어(수우미양가 / 우수·보통·미흡)도 성취도로 바꿔 읽음
function letters(s, art){
  let t = String(s||'').toUpperCase();
  if(!/[A-E]/.test(t)){  // 영문 성취도가 없을 때만 평어로 해석 (과목명 '수학' 등 오인 방지)
    t = t.replace(/우수/g,'A').replace(/보통/g,'B').replace(/미흡/g,'C');
    if(!art) t = t.replace(/수/g,'A').replace(/우/g,'B').replace(/미/g,'C').replace(/양/g,'D').replace(/가/g,'E');
  }
  return t.match(art ? /[ABC]/g : /[A-E]/g) || [];
}
// 미인정 결석일수(지각·조퇴·결과 3회 = 1일) → 학년별 출석 점수
const attPts = n => n <= 0 ? 5 : n <= 2 ? 4 : n <= 4 ? 3 : n <= 6 ? 2 : n <= 8 ? 1 : 0;
// 연간 봉사시간 → 학년별 봉사 점수
const volPts = h => h >= 7 ? 5 : h >= 6 ? 4.5 : h >= 5 ? 4 : h >= 4 ? 3.5 : 3;
const bonus = v => Math.max(0, Math.min(0.5, +v || 0));

function jhCalc(sid){
  const d = S.jinhak.data[sid] ? jhD(sid) : {grades:{}, art:'', att:{}, vol:{}, act:{}, beh:{}};
  const ratio = {}; const have = [];
  JH_SEMS.forEach(s => { const a = letters(d.grades[s.k]); if(a.length){ ratio[s.k] = rnd(a.reduce((t,x)=>t+CONV[x],0) / (a.length*5), 5); have.push(ratio[s.k]); } });
  const fb = have.length ? rnd(have.reduce((a,b)=>a+b,0)/have.length, 5) : null;
  const per = {}, estimated = [];
  let gen = 0;
  JH_SEMS.forEach(s => {
    let r = ratio[s.k];
    if(r == null && S.jinhak.config.estimateMissing && fb != null){ r = fb; estimated.push(s.k); }
    per[s.k] = r == null ? null : s.p * r;
    gen += per[s.k] || 0;
  });
  gen = rnd(gen, 3);
  const ar = letters(d.art, true);
  const artRatio = ar.length ? rnd(ar.reduce((t,x)=>t+CONV[x],0) / (ar.length*5), 3) : null;
  const art = artRatio == null ? null : rnd(60 * artRatio, 3);
  const attY = {}, volY = {};
  let att = 0, vol = 0, act = 0, beh = 0;
  YRS.forEach(y => {
    const a = d.att[y] || {};
    const days = (+a.abs || 0) + Math.floor((+a.late || 0) / 3);
    attY[y] = attPts(days); att += attY[y];
    volY[y] = volPts(+d.vol[y] || 0); vol += volY[y];
    act += 4.5 + bonus(d.act[y]);
    beh += 4.5 + bonus(d.beh[y]);
  });
  const subj = gen + (art || 0);
  return {per, gen, art, subj, att, vol, act, beh, attY, volY,
    total: rnd(subj + att + vol + act + beh, 3), estimated, has: have.length > 0, artMissing: art == null};
}
function jhRanked(){
  const rows = sortedStudents().map(s => ({s, r:jhCalc(s.id)}));
  const g = rows.filter(x=>x.r.has);
  g.forEach(x => { x.rank = g.filter(y=>y.r.total > x.r.total + 1e-9).length + 1; x.pct = x.rank / g.length * 100; });
  return {rows, n:g.length};
}

        <button class="btn sm" onclick="App.jhCsv()">엑셀(CSV)</button><button class="btn sm" onclick="window.print()">인쇄</button>
      </span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:13px">교과 240(일반 180 + 예체능 60) · 출결 15 · 봉사 15 · 창체 15 · 행동발달 15. 이름을 누르면 입력해요. *는 아직 없는 학기를 입력된 학기 평균으로 추정한 값(가내신)이에요. 석차는 우리 반 안의 순위예요.</p>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>번호</th><th>이름</th>${JH_SEMS.map(s=>`<th>${s.k}<br><span style="font-size:11px">${s.p}점</span></th>`).join('')}<th>예체능<br><span style="font-size:11px">60점</span></th><th>교과<br><span style="font-size:11px">240</span></th><th>출결</th><th>봉사</th><th>창체</th><th>행동</th><th>총점</th><th>반 석차</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`
      : '<div class="empty">학급 → 명렬표에 학생을 먼저 등록해 주세요.</div>'}
  </div>`;
};

const JH_PASTE = {

Object.assign(App, {
  jhSub(k){ ui.jhSub = k; render(); },
  jhSort(v){ ui.jhSort = v; render(); },
  jhEst(v){ S.jinhak.config.estimateMissing = v; save(); render(); },
  jhEdit(sid){
    const s = stu(sid), d = jhD(sid), y = today().slice(0,4);
    let a = 0, l = 0;
    Object.keys(S.attendance).filter(k=>k.startsWith(y)).forEach(k=>{ const r = S.attendance[k][sid]; if(r && r.reason==='미인정'){ if(r.type==='결석') a++; else l++; } });
    const inp = (id, v, w, ph='') => `<input type="text" inputmode="decimal" id="${id}" value="${esc(v??'')}" placeholder="${ph}" style="width:${w}px">`;
    modal(`<h3>🎓 ${esc(s.no)}. ${esc(s.name)} 고입 성적</h3>
      <p class="muted" style="margin:0 0 6px;font-size:13px">일반교과 성취도를 학기별로 순서대로 입력하세요 (예: <b>AABAC</b>). 체육·음악·미술은 아래 예체능 칸에 따로 넣어요.</p>
      ${JH_SEMS.map(sm=>`<div class="field"><label>${sm.k} 학기 일반교과 (${sm.p}점)</label><input type="text" id="jh-g-${sm.k}" value="${esc(d.grades[sm.k]||'')}" placeholder="예) A A B A C B A" style="letter-spacing:2px"></div>`).join('')}
      <div class="field"><label>예체능 3년 전체 성취도 (60점, A/B/C)</label><input type="text" id="jh-art" value="${esc(d.art||'')}" placeholder="예) A A B A A A …" style="letter-spacing:2px"></div>
      <div class="tbl-wrap"><table style="margin:6px 0">
        <thead><tr><th></th><th>미인정 결석</th><th>미인정 지각·조퇴·결과</th><th>봉사 시간</th><th>창체 가산</th><th>행동 가산</th></tr></thead>
        <tbody>${YRS.map(yy=>`<tr><td><b>${yy}학년</b></td>
          <td>${inp('jh-a-'+yy,(d.att[yy]||{}).abs,70,'0')}</td><td>${inp('jh-l-'+yy,(d.att[yy]||{}).late,70,'0')}</td>
          <td>${inp('jh-v-'+yy,d.vol[yy],70,'0')}</td><td>${inp('jh-c-'+yy,d.act[yy],60,'0')}</td><td>${inp('jh-b-'+yy,d.beh[yy],60,'0')}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12px;margin:0 0 8px">가산은 0~0.5 (학업성적관리위원회 결정). 참고: 이 앱의 ${y}년 출결 기록 — 미인정 결석 ${a}일, 미인정 지각·조퇴·결과 ${l}회</p>
      <div id="jh-res" class="notice" style="margin:6px 0 10px"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal();render()">닫기</button><button class="btn pri" onclick="App.jhSave('${sid}',true)">저장</button></div>`);
    $('#modal').querySelectorAll('input').forEach(i => i.addEventListener('input', () => App.jhSave(sid,false)));
    App.jhShow(sid);
  },
  jhSave(sid, close){
    const d = jhD(sid), v = id => $('#'+id).value.trim();
    JH_SEMS.forEach(sm => { const x = v('jh-g-'+sm.k); if(x) d.grades[sm.k] = x; else delete d.grades[sm.k]; });
    d.art = v('jh-art');
    YRS.forEach(y => {
      d.att[y] = {abs:+v('jh-a-'+y)||0, late:+v('jh-l-'+y)||0};
      const vh = v('jh-v-'+y); if(vh==='') delete d.vol[y]; else d.vol[y] = +vh||0;
      d.act[y] = v('jh-c-'+y); d.beh[y] = v('jh-b-'+y);
    });
    save();
    if(close){ closeModal(); render(); toast('저장됨'); } else App.jhShow(sid);
  },
  jhShow(sid){
    const r = jhCalc(sid);
    $('#jh-res').innerHTML = r.has
      ? `일반 <b>${r3(r.gen)}</b> + 예체능 <b>${r.art==null?'미입력':r3(r.art)}</b> + 출결 <b>${r.att}</b> + 봉사 <b>${r.vol}</b> + 창체 <b>${r.act}</b> + 행동 <b>${r.beh}</b> = <b style="color:var(--accent);font-size:17px">${r3(r.total)}</b> / 300
         ${r.estimated.length?`<br><span class="muted" style="font-size:12px">${r.estimated.join(', ')} 학기는 입력된 학기 평균으로 추정했어요.</span>`:''}
         ${r.artMissing?`<br><span class="muted" style="font-size:12px">예체능을 입력하지 않아 0점으로 계산 중이에요.</span>`:''}`
      : '일반교과 성취도를 한 학기 이상 입력하면 점수가 계산돼요.';
  },
  jhDoPaste(){
    const type = ui.jhPasteType || '3-1', lines = $('#jh-paste').value.split(/\r?\n/).filter(l=>l.trim());
    let ok = 0; const miss = [];
    for(const l of lines){
      let cols = (l.includes('\t') ? l.split('\t') : l.trim().split(/\s+/)).map(x=>x.trim());
      if(/^(번호|이름)$/.test(cols[0])) continue;
      let st = null;
      if(/^\d+$/.test(cols[0])){
        const no = cols.shift();
        st = S.students.find(s => String(+s.no) === String(+no));
        if(cols[0] && !/^([A-EP\-\d.]*|수|우|미|양|가|우수|보통|미흡)$/i.test(cols[0])){ const nm = cols.shift(); if(!st) st = S.students.find(s=>s.name===nm); }
      } else { const nm = cols.shift(); st = S.students.find(s=>s.name===nm); }
      if(!st){ miss.push(l.slice(0,14)); continue; }
      const d = jhD(st.id);
      const n = i => (cols[i] === undefined || cols[i] === '') ? undefined : (+cols[i] || 0);
      if(type === 'art') d.art = letters(cols.join(' '), true).join('');
      else if(type === 'att') YRS.forEach((y,i) => { const A = n(i*2), L = n(i*2+1); if(A!==undefined || L!==undefined) d.att[y] = {abs:A||0, late:L||0}; });
      else if(type === 'vol') YRS.forEach((y,i) => { if(n(i)!==undefined) d.vol[y] = n(i); });
      else if(type === 'bonus') YRS.forEach((y,i) => { if(n(i)!==undefined) d.act[y] = n(i); if(n(i+3)!==undefined) d.beh[y] = n(i+3); });
      else { const g = letters(cols.join(' ')); if(g.length) d.grades[type] = g.join(''); else delete d.grades[type]; }
      ok++;
    }
    save(); toast(`${ok}명 반영됨`);
    if(miss.length) alert('명렬표에서 찾지 못한 줄:\n' + miss.join('\n'));
    ui.jhSub = 'list'; render();
  },
  jhCsv(){
    const {rows} = jhRanked();
    const out = [['번호','이름',...JH_SEMS.map(s=>s.k+'학기('+s.p+')'),'일반교과(180)','예체능(60)','교과(240)','출결(15)','봉사(15)','창체(15)','행동발달(15)','총점(300)','반 석차']];
    rows.forEach(({s,r,rank}) => out.push([s.no, s.name, ...JH_SEMS.map(sm=>r.per[sm.k]==null?'':r3(r.per[sm.k])), r3(r.gen), r.art==null?'':r3(r.art), r3(r.subj), r.att, r.vol, r.act, r.beh, r.has?r3(r.total):'', rank||'']));
    csv(out, `고입내신_${today()}.csv`);
  }
});

/* ============ 여러 기기 자동 동기화 (Firebase, 선택) ============ */
const DEVICE = uid();
const Sync = {user:null, status:'꺼짐', timer:null, pending:null};
function setSyncStatus(t){ Sync.status = t; const el = $('#sync'); if(el) el.textContent = Sync.user ? '☁️ ' + t : ''; }
function parseFirebaseConfig(txt){
  const m = String(txt||'').match(/\{[\s\S]*\}/); if(!m) return null;
  let s = m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  try{ const o = JSON.parse(s); return o.apiKey && o.projectId ? o : null; }catch(e){ return null; }
}
async function syncInit(){
  const cfg = parseFirebaseConfig(S.settings.firebase); if(!cfg) return;
  try{
    setSyncStatus('연결 중…');
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM, authM, fsM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    Object.assign(Sync, {authM, fsM});
    const app = appM.initializeApp(cfg);
    Sync.auth = authM.getAuth(app); Sync.db = fsM.getFirestore(app);
    authM.getRedirectResult(Sync.auth).catch(()=>{});
    authM.onAuthStateChanged(Sync.auth, u => {
      Sync.user = u;
      if(u) syncStart(); else { if(Sync.unsub) Sync.unsub(); setSyncStatus('로그인 필요'); }
      if(ui.tab === 'settings') render();
    });
  }catch(e){ setSyncStatus('연결 실패'); console.error(e); }
}
async function syncStart(){
  const {doc, getDoc, onSnapshot} = Sync.fsM;
  Sync.ref = doc(Sync.db, 'gyomu', Sync.user.uid);
  try{
    const snap = await getDoc(Sync.ref);
    if(snap.exists()){
      const r = snap.data();
      if(!S.meta.syncedOnce){
        const remote = JSON.parse(r.data);
        const localEmpty = !S.students.length && !S.records.length && !S.events.length;
        if(localEmpty || confirm(`클라우드에 저장된 데이터가 있어요 (학생 ${remote.students.length}명 · 기록 ${(remote.records||[]).length}건).\n\n[확인] 클라우드 데이터를 이 기기로 가져오기\n[취소] 이 기기의 데이터로 클라우드를 덮어쓰기`)) applyRemote(r, true);
        else syncPush();
      } else if((r.updatedAt||0) > (S.meta.updatedAt||0)) applyRemote(r, true);
      else if((r.updatedAt||0) < (S.meta.updatedAt||0)) syncPush();
    } else syncPush();
    S.meta.syncedOnce = true; localStorage.setItem(KEY, JSON.stringify(S));
    if(Sync.unsub) Sync.unsub();
    Sync.unsub = onSnapshot(Sync.ref, s => {
      if(!s.exists() || s.metadata.hasPendingWrites) return;
      const r = s.data();
      if(r.device !== DEVICE && (r.updatedAt||0) > (S.meta.updatedAt||0)) applyRemote(r);
    });
    setSyncStatus('동기화됨');
  }catch(e){ setSyncStatus('동기화 오류'); console.error(e); }
}
function applyRemote(r, force){
  const a = document.activeElement;
  if(!force && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ Sync.pending = r; return; }  // 입력 중이면 잠시 미룸
  const keepCfg = S.settings.firebase;
  const d = JSON.parse(r.data);
  d.meta = Object.assign(d.meta||{}, {updatedAt:r.updatedAt, syncedOnce:true});
  localStorage.setItem(KEY, JSON.stringify(d));
  S = load(); if(!S.settings.firebase) S.settings.firebase = keepCfg;
  localStorage.setItem(KEY, JSON.stringify(S));
  Sync.pending = null;
  if(!$('#modal').innerHTML) render();
  setSyncStatus('동기화됨 ' + new Date().toTimeString().slice(0,5));
}
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(Sync.pending && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) applyRemote(Sync.pending);
}, 300));
function syncSchedule(){
  if(!Sync.user || !Sync.ref) return;
  clearTimeout(Sync.timer); setSyncStatus('저장 중…');
  Sync.timer = setTimeout(syncPush, 1200);
}
async function syncPush(){
  if(!Sync.user || !Sync.ref) return;
  try{
    await Sync.fsM.setDoc(Sync.ref, {data:JSON.stringify(S), updatedAt:S.meta.updatedAt||Date.now(), device:DEVICE});
    setSyncStatus('동기화됨 ' + new Date().toTimeString().slice(0,5));
  }catch(e){ setSyncStatus('동기화 오류 (인터넷 확인)'); console.error(e); }
}
Object.assign(App, {
  editFirebase(){
    modal(`<h3>Firebase 연결 정보</h3>
      <p class="muted" style="margin-top:0;font-size:14px">Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에 나오는 <b>const firebaseConfig = { … }</b> 부분을 통째로 붙여넣으세요.</p>
      <textarea id="fb-cfg" rows="10" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  authDomain: &quot;….firebaseapp.com&quot;,&#10;  projectId: &quot;…&quot;,&#10;  …&#10;};">${esc(S.settings.firebase)}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        ${S.settings.firebase?`<button class="btn danger" onclick="App.saveFirebase('')">연결 해제</button>`:'<span></span>'}
        <span class="row"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="App.saveFirebase($('#fb-cfg').value)">저장</button></span></div>`);
  },
  saveFirebase(txt){
    if(txt && !parseFirebaseConfig(txt)) return alert('연결 정보를 읽지 못했어요. apiKey와 projectId가 들어 있는지 확인해 주세요.');
    S.settings.firebase = txt.trim(); S.meta.syncedOnce = false;
    localStorage.setItem(KEY, JSON.stringify(S));
    location.reload();
  },
  async login(){
    if(!Sync.auth) return toast('연결 중이에요. 잠시 후 다시 눌러 주세요');
    const p = new Sync.authM.GoogleAuthProvider();
    try{ await Sync.authM.signInWithPopup(Sync.auth, p); }
    catch(e){
      if(/popup/.test(e.code||'')) Sync.authM.signInWithRedirect(Sync.auth, p);
      else alert('로그인 실패: ' + (e.code||e.message) + (e.code==='auth/unauthorized-domain' ? '\n\nFirebase 콘솔 → Authentication → 설정 → 승인된 도메인에 이 사이트 주소(예: 아이디.github.io)를 추가해 주세요.' : ''));
    }
  },
  async logout(){ if(!confirm('로그아웃할까요? 이 기기의 데이터는 그대로 남아요.')) return; await Sync.authM.signOut(Sync.auth); S.meta.syncedOnce = false; localStorage.setItem(KEY, JSON.stringify(S)); render(); },
  syncNow(){ syncPush(); }
});

function addMin(hm, n){ const [h,m] = hm.split(':').map(Number); const t = h*60+m+n; return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`; }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function csv(rows, name){
  const body = rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(new Blob(['\ufeff'+body], {type:'text/csv;charset=utf-8'}), name);
}
function modal(html){ $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function tick(){ const d = new Date(); $('#clock').textContent = `${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick, 30000);
window.addEventListener('storage', e => { if(e.key === KEY){ S = load(); render(); } });
render();
syncInit();
</script>
